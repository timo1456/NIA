<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Student Result</title>
</head>
<body>

<div class="result-container">
    <h2>Select Student Result</h2>

    <p>
        <strong>Academic Session:</strong>
        {{ active_period.academic_session }}
    </p>
    <p>
        <strong>Term:</strong>
        {{ active_period.term }}
    </p>

    <form method="GET" action="/result-sheet" onsubmit="this.action='/result/' + document.getElementById('student_id').value;">
        <label for="student_id">Select Student</label><br>

        <select name="student_id" id="student_id" required>
            <option value="">Select Student</option>

            {% for item in available_students %}
                <option value="{{ item.id }}">
                    {{ item.name }} — {{ item.class_name }}
                </option>
            {% endfor %}
        </select>

        <br><br>
        <button type="submit">
            View Result
        </button>
    </form>

    <br>
    <a href="/dashboard">Back to Dashboard</a>
</div>

</body>
</html>
