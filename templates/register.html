<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | NIA</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='site.css') }}">
</head>
<body class="portal-page">
    <main class="portal-shell">
        <a class="mini-brand" href="/">
            <img src="{{ url_for('static', filename='logo.jpg') }}" alt="School logo">
            <span>NEW INNOVATION ACADEMY</span>
        </a>
        <section class="portal-card">
            <span class="eyebrow">STUDENT ACCOUNT</span>
            <h1>Student Registration</h1>
            {% if user_exist %}
                <div class="alert alert-error">{{ user_exist }}</div>
            {% endif %}
            <form method="POST" class="portal-form">
                <label for="username">Username</label>
                <input id="username" name="username" autocomplete="username" required>
                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="new-password" required>
                <button class="btn btn-primary btn-full" type="submit">Register</button>
            </form>
            <a class="back-link" href="/login">← Back to staff login</a>
        </section>
    </main>
</body>
</html>
