<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Student</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='site.css') }}">
</head>
<body class="app-page">
    <header class="feature-nav">
        <a class="mini-brand" href="/">
            <img src="{{ url_for('static', filename='logo.jpg') }}" alt="School logo">
            <span>NEW INNOVATION ACADEMY</span>
        </a>
        <a class="nav-link" href="/dashboard">← Back to Dashboard</a>
    </header>


<h2>Create Student</h2>

{% if error %}
    <p style="color:red;">{{ error }}</p>
{% endif %}

<form method="POST">

    <label>Student ID</label><br>
    <input type="text" name="student_id" placeholder="Enter Student ID" required>

    <br><br>

    <label>Student Name</label><br>
    <input type="text" name="name" placeholder="Student Name" required>

    <br><br>

    <label>Class</label><br>
    <select name="class_name" required>
        <option value="">Select Class</option>
        {% for class_name in classes %}
            <option value="{{ class_name }}">{{ class_name }}</option>
        {% endfor %}
    </select>

    <br><br>

    <label>Date of Birth</label><br>
    <input type="date" name="date_of_birth" required>

    <br><br>

    <label>Gender</label><br>
    <select name="gender" required>
        <option value="">Select Gender</option>
        {% for gender in gen_der %}
            <option value="{{ gender }}">{{ gender }}</option>
        {% endfor %}
    </select>

    <br><br>

    <button type="submit">Create Student</button>
</form>
</body>
</html>
