<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Teacher Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='site.css') }}">
</head>

<body class="app-page">
    <header class="feature-nav">
        <a class="mini-brand" href="/">
            <img src="{{ url_for('static', filename='logo.jpg') }}" alt="School logo">
            <span>NEW INNOVATION ACADEMY</span>
        </a>
        <a class="nav-link" href="/dashboard">← Back to Dashboard</a>
    </header>


    <h2>Change Teacher Password</h2>

    <p>
        <strong>Teacher:</strong> {{ teacher.name }}
        <br>
        <strong>Username:</strong> {{ teacher.username }}
    </p>

    {% if error %}
        <p style="color: red;">
            {{ error }}
        </p>
    {% endif %}

    <form method="POST">
        <label for="new_password">New Password</label>
        <br>
        <input
            id="new_password"
            type="password"
            name="new_password"
            minlength="8"
            required
        >

        <br><br>

        <label for="confirm_password">Confirm New Password</label>
        <br>
        <input
            id="confirm_password"
            type="password"
            name="confirm_password"
            minlength="8"
            required
        >

        <br><br>

        <button type="submit">
            Change Password
        </button>
    </form>

    <br>

    <a href="/teacher/{{ teacher.id }}">
        Cancel
    </a>

</body>
</html>
