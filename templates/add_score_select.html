<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Scores</title>

</head>

<body>

    <h2>Add Scores</h2>


    <p>
        Select the class and subject you want to enter scores for.
    </p>


    {% if assignments %}

        <form method="POST">

            <label>
                Teaching Assignment
            </label>

            <br>


            <select
                name="assignment_id"
                required
            >

                <option value="">
                    Select Class / Subject
                </option>


                {% for assignment in assignments %}

                    <option
                        value="{{ assignment.id }}"
                    >

                        {{ assignment.class_name }}
                        -
                        {{ assignment.subject.name }}

                    </option>

                {% endfor %}

            </select>


            <br><br>


            <button type="submit">
                Continue
            </button>

        </form>

    {% else %}

        <p>
            You have no teaching assignments.
        </p>

    {% endif %}

    

    <br>


    <a href="/dashboard">
        Back to Dashboard
    </a>

</body>

</html>
