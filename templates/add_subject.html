<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Subject</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='site.css') }}">
</head>

<body class="app-page">
    <header class="feature-nav">
        <a class="mini-brand" href="/">
            <img src="{{ url_for('static', filename='logo.jpg') }}" alt="School logo">
            <span>NEW INNOVATION ACADEMY</span>
        </a>
        <a class="nav-link" href="/dashboard">← Back to Dashboard</a>
    </header>


    <h2>Add Subject</h2>


    {% if error %}

        <p style="color:red;">
            {{ error }}
        </p>

    {% endif %}


    <form method="POST">

        <label>
            Subject Name
        </label>

        <br>

        <input
            type="text"
            name="name"
            placeholder="e.g. Mathematics"
            required
        >

        <br><br>

        <button type="submit">
            Add Subject
        </button>

    </form>


    <br>
  

    <a href="/subjects">
        View Subjects
    </a>
</body>

</html>
