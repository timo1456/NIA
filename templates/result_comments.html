<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Result Comments | NIA</title><link rel="stylesheet" href="{{ url_for('static', filename='site.css') }}"></head>
<body class="app-page">
<header class="feature-nav"><a class="mini-brand" href="/"><img src="{{ url_for('static', filename='logo.jpg') }}" alt="School logo"><span>NEW INNOVATION ACADEMY</span></a><a class="nav-link" href="/dashboard">← Back to Dashboard</a></header>
<main class="app-shell">
<div class="page-heading"><span class="eyebrow">RESULT MANAGEMENT</span><h1>Principal & Guidance Counsellor Remarks</h1><p class="muted">{{ active_period.academic_session }} · {{ active_period.term }}</p></div>
<form method="GET" class="portal-card" style="margin-top:25px;">
<label>Class</label><select name="class_name" onchange="this.form.submit()" required><option value="">Select Class</option>{% for class_name in classes %}<option value="{{ class_name }}" {% if selected_class == class_name %}selected{% endif %}>{{ class_name }}</option>{% endfor %}</select>
{% if selected_class %}<label>Student</label><select name="student_id" onchange="this.form.submit()" required><option value="">Select Student</option>{% for item in students %}<option value="{{ item.id }}" {% if student and student.id == item.id %}selected{% endif %}>{{ item.student_id }} — {{ item.name }}</option>{% endfor %}</select>{% endif %}
</form>
{% if student %}
<form method="POST" class="portal-card" style="margin-top:20px;">
<input type="hidden" name="class_name" value="{{ selected_class }}"><input type="hidden" name="student_id" value="{{ student.id }}">
<label>Principal's Remark</label><textarea name="principal_remark" rows="5" style="width:100%;">{{ comment.principal_remark if comment else '' }}</textarea>
<label>Guidance Counsellor's Remark</label><textarea name="counselor_remark" rows="5" style="width:100%;">{{ comment.counselor_remark if comment else '' }}</textarea>
<button class="btn btn-primary" type="submit">Save Remarks</button>
</form>
{% endif %}
</main></body></html>
